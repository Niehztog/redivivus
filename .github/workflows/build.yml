name: build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']
  workflow_dispatch:

# A newer push makes an older build of the same ref pointless.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mingw-i686:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq g++-mingw-w64-i686 binutils-mingw-w64-i686 cmake ninja-build

      - name: Build from a clean clone
        run: tools/check-build.sh "$GITHUB_WORKSPACE" "$GITHUB_SHA"
